name: WWM News to Discord

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  post-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Обязательно для сохранения файла

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужно для корректной работы авто-коммита

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python wwm_news_bot.py

      # Заменяем ручной git push на надежное готовое действие
      - name: Commit and push state file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update sent news state"
          file_pattern: sent_news.json
