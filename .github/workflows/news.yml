name: WWM News to Discord

on:
  schedule:
    # Запуск каждые 2 часа. Время указано в UTC (0 = полночь по Гринвичу).
    # Вы можете изменить расписание: '0 */4 * * *' (каждые 4 часа), '0 9 * * *' (каждый день в 9 утра UTC) и т.д.
    - cron: '0 */2 * * *'
  workflow_dispatch: # Позволяет запускать вручную кнопкой в GitHub

jobs:
  post-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на запись, чтобы сохранять sent_news.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Указываем стабильную версию Python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python wwm_news_bot.py

      - name: Commit and push state file
        # Этот шаг сохраняет обновленный sent_news.json обратно в репозиторий,
        # чтобы бот не отправлял дубликаты при следующем запуске.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_news.json
          # Проверяем, изменился ли файл, и если да — делаем коммит
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent news state" && git push)
